name: One Link CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/ONE_LINK_FOUNDATION.md"
      - "README.md"
      - ".github/workflows/one-link-ci.yml"
  push:
    branches: [feature/one-link-unified-portal]
    paths:
      - "frontend/**"
      - "docs/ONE_LINK_FOUNDATION.md"
      - "README.md"
      - ".github/workflows/one-link-ci.yml"

permissions:
  contents: read

concurrency:
  group: one-link-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build One Link PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
