databases:
  - name: domislink-db
    plan: free
    databaseName: domislink
    user: domislink

services:
  - type: web
    name: domislink-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: domislink-db
          property: connectionString

  - type: web
    name: domislink-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: domislink-backend
          property: url
